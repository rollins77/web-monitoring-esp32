<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Monitoring</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulsate-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 md:p-12 flex flex-col items-center">

    <header class="text-center mb-10 w-full max-w-4xl">
        <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            <i class="fa-solid fa-house-signal mr-2"></i> Real-time Monitoring
        </h1>
        <p class="text-slate-400 mt-2">ESP32-C6 Sensor Dashboard</p>
        
        <!-- Indikator Status Koneksi -->
        <div id="connection-status" class="mt-4 inline-flex items-center px-3 py-1 rounded-full bg-slate-800 text-sm">
            <div class="w-2 h-2 rounded-full bg-yellow-500 mr-2 animate-pulse" id="status-dot"></div>
            <span id="status-text">Menghubungkan ke Firebase...</span>
        </div>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div id="gas-card" class="bg-slate-800 rounded-2xl p-6 shadow-lg border border-slate-700 transition-all duration-300">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-200">Kualitas Udara (MQ2)</h2>
                <div class="p-3 rounded-xl bg-blue-500/20 text-blue-400">
                    <i class="fa-solid fa-wind text-xl"></i>
                </div>
            </div>
            <div class="flex items-end gap-2">
                <span id="gas-value" class="text-5xl font-bold text-white">0</span>
                <span class="text-slate-400 mb-1">ADC</span>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-700 rounded-full h-2.5 mt-6">
                <div id="gas-progress" class="bg-blue-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="gas-status" class="mt-3 text-sm font-medium text-blue-400">Udara Bersih</p>
        </div>

        <div id="flame-card" class="bg-slate-800 rounded-2xl p-6 shadow-lg border border-slate-700 transition-all duration-300">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-200">Detektor Api</h2>
                <div id="flame-icon-container" class="p-3 rounded-xl bg-emerald-500/20 text-emerald-400">
                    <i class="fa-solid fa-fire-extinguisher text-xl"></i>
                </div>
            </div>
            <div class="mt-4">
                <span id="flame-status" class="text-3xl font-bold text-emerald-400">Aman</span>
                <p class="text-slate-400 mt-2 text-sm" id="flame-desc">Tidak ada titik api yang terdeteksi.</p>
            </div>
        </div>

    </main>

    <!-- Menggunakan Firebase SDK v11.6.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDhw0zE9rJZqXO8iowt7AlwHNDvTA0ktL8",
            authDomain: "device-streaming-64a86d8c.firebaseapp.com",
            databaseURL: "https://device-streaming-64a86d8c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "device-streaming-64a86d8c",
            storageBucket: "device-streaming-64a86d8c.firebasestorage.app",
            messagingSenderId: "1021955135039",
            appId: "1:1021955135039:web:b2f522b7e1a17768680a8a"
        };

        try {
            // Inisialisasi Firebase
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            // Update status UI
            document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-emerald-500');
            document.getElementById('status-text').innerText = "Terhubung Real-time";

            const mq2Ref = ref(db, 'Sensors/MQ2');
            const flameRef = ref(db, 'Sensors/Flame');

            // Listener Sensor Gas (MQ2)
            onValue(mq2Ref, (snapshot) => {
                const val = snapshot.val() || 0;
                document.getElementById('gas-value').innerText = val;
                
                // Kalkulasi persentase (asumsi max ADC 4095 pada ESP32-C6)
                let percentage = (val / 4095) * 100;
                if (percentage > 100) percentage = 100;
                document.getElementById('gas-progress').style.width = percentage + '%';

                const gasCard = document.getElementById('gas-card');
                const gasStatus = document.getElementById('gas-status');
                const gasProgress = document.getElementById('gas-progress');

                // Logika Warna berdasarkan ambang batas (Threshold)
                if (val > 2000) {
                    gasStatus.innerText = "BAHAYA: Asap/Gas Tinggi!";
                    gasStatus.className = "mt-3 text-sm font-medium text-red-500";
                    gasProgress.className = "bg-red-500 h-2.5 rounded-full transition-all duration-500";
                    gasCard.classList.add('border-red-500', 'pulsate-red');
                } else if (val > 1000) {
                    gasStatus.innerText = "PERINGATAN: Asap/Gas terdeteksi.";
                    gasStatus.className = "mt-3 text-sm font-medium text-yellow-500";
                    gasProgress.className = "bg-yellow-500 h-2.5 rounded-full transition-all duration-500";
                    gasCard.classList.remove('border-red-500', 'pulsate-red');
                } else {
                    gasStatus.innerText = "Udara Bersih";
                    gasStatus.className = "mt-3 text-sm font-medium text-blue-400";
                    gasProgress.className = "bg-blue-500 h-2.5 rounded-full transition-all duration-500";
                    gasCard.classList.remove('border-red-500', 'pulsate-red');
                }
            });

            // Listener Sensor Api (Flame)
            onValue(flameRef, (snapshot) => {
                // Sensor Flame biasanya bernilai 0 jika mendeteksi api (Active Low)
                const isFireDetected = snapshot.val() === 0; 
                
                const flameCard = document.getElementById('flame-card');
                const flameStatus = document.getElementById('flame-status');
                const flameDesc = document.getElementById('flame-desc');
                const flameIcon = document.getElementById('flame-icon-container');

                if (isFireDetected) {
                    flameStatus.innerText = "API TERDETEKSI!";
                    flameStatus.className = "text-3xl font-bold text-red-500 animate-pulse";
                    flameDesc.innerText = "Segera lakukan tindakan evakuasi atau pemadaman!";
                    flameIcon.className = "p-3 rounded-xl bg-red-500/20 text-red-500";
                    flameIcon.innerHTML = '<i class="fa-solid fa-fire text-xl animate-bounce"></i>';
                    flameCard.classList.add('border-red-500', 'bg-red-900/20', 'pulsate-red');
                } else {
                    flameStatus.innerText = "Aman";
                    flameStatus.className = "text-3xl font-bold text-emerald-400";
                    flameDesc.innerText = "Tidak ada titik api yang terdeteksi.";
                    flameIcon.className = "p-3 rounded-xl bg-emerald-500/20 text-emerald-400";
                    flameIcon.innerHTML = '<i class="fa-solid fa-fire-extinguisher text-xl"></i>';
                    flameCard.classList.remove('border-red-500', 'bg-red-900/20', 'pulsate-red');
                }
            });

        } catch (error) {
            console.error("Firebase Initialization Error:", error);
            document.getElementById('status-text').innerText = "Gagal terhubung ke Firebase";
            document.getElementById('status-dot').classList.replace('bg-yellow-500', 'bg-red-500');
        }
    </script>
</body>
</html>
